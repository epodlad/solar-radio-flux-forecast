[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "solar-radio-flux-forecast"
version = "0.1.0.dev1"
description = "Independent short-term probabilistic F10.7 forecasting from Penticton observations"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[project.scripts]
f107 = "f107forecast.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
f107forecast = ["static/*"]
[tool.pytest.ini_options]
pythonpath = ["src"]
